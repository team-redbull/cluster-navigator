# Only the values the chart needs, and those with a real default. Optional
# values left out here (segmentsManagerUrl, network, clusterName,
# ingestToken.existingSecret, tls.caBundle.configMapName, image.tag,
# imagePullSecrets, nodeSelector, tolerations) are listed in the README,
# under Configuration > Collector.

image:
  repository: ghcr.io/team-redbull/cluster-navigator-collector
  pullPolicy: IfNotPresent

# Base URL of the central Cluster Navigator server. Required.
navigatorUrl: ""

# The bearer token the server expects on its ingest endpoint. Required, unless
# ingestToken.existingSecret names a Secret holding it under the key below.
ingestToken:
  key: token
  # Keep it out of git.
  value: ""

# How the cluster type is decided.
#   auto      the collector works it out from the cluster's own APIs (recommended)
#   generic | click | mce | kubevirt   force a type, for a cluster auto gets wrong
clusterType: auto

# Cron schedule, and how long one run may take.
schedule: "*/30 * * * *"
activeDeadlineSeconds: 300

# TLS towards the server and Segments Manager. Certificates are not verified
# by default: on-site router CAs change too often to pin. To verify, set
# insecureSkipVerify to false and, if the image's own trust store lacks the CA
# that signed their Route certificates, set tls.caBundle.configMapName to a
# ConfigMap holding it.
tls:
  caBundle:
    key: ca-bundle.crt
  insecureSkipVerify: true

# "Default" gives the pod the node's own /etc/resolv.conf. That is how the
# collector reports the DNS servers the nodes use, with no privileged pod and
# no hostPath. It also means in-cluster Service names do not resolve, so
# navigatorUrl and segmentsManagerUrl must be Route or other external
# hostnames. Set "ClusterFirst" only when they run in this same cluster and
# you use their Service URLs;
# the reported DNS servers will then be the cluster DNS, not the nodes'.
dnsPolicy: Default

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 3
