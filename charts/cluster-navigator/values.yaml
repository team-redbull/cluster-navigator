# Only the values the chart needs, and those with a real default. Optional
# values left out here (secret.existingSecret, secret.sessionSecret,
# secret.serviceTokens, auth.adminGroups, auth.roles, auth.roleGroups,
# route.host, grafanaUrlTemplate, image.tag, imagePullSecrets, nodeSelector,
# tolerations) are listed in the README, under Configuration > Server chart.

image:
  repository: ghcr.io/team-redbull/cluster-navigator
  pullPolicy: IfNotPresent

replicas: 2

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# Both required, unless secret.existingSecret names a Secret you manage
# yourself, with the keys MONGO_URI, INGEST_TOKEN, SESSION_SECRET (and
# optionally SERVICE_TOKENS). Under Argo CD use existingSecret: Argo renders
# without cluster access, so a chart-generated session secret would change on
# every sync and sign every user out.
secret:
  # mongodb://user:password@host:27017
  mongoUri: ""
  # The bearer token collectors send. Use a long random value.
  ingestToken: ""

mongo:
  dbName: cluster-navigator
  # Reports older than this are deleted, so decommissioned clusters drop out.
  reportTtlDays: 7

# ---------------------------------------------------------------------------
# Who may see what
# ---------------------------------------------------------------------------
# Users sign in with OpenShift: on the cluster's own login page, with their
# LDAP credentials. Anyone who does not sign in is a client. Admins come from
# auth.adminGroups, other kinds of user from auth.roles and auth.roleGroups.
auth:
  # Seconds a group lookup is cached. Removing someone from a group takes
  # their access away within this time, even if they are signed in.
  groupCacheSeconds: 60
  sessionTtlHours: 12
  # Do not verify the OAuth server's certificate during the token exchange.
  # On by default: on-site router CAs are not in the pod's trust store and
  # change too often to pin. The API server is still verified against the
  # cluster CA. Set false where the router certificate is trusted.
  oauthInsecureSkipVerify: true

# A cluster whose collector has been silent this long is shown as stale.
# Keep it at about three collector intervals.
staleAfterSeconds: 5400

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
